<div class="ssm">
<button class="ssm-toggle" type="button" aria-expanded="false" aria-label="Abrir menú">
<svg class="ssm-icon-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M222,128a6,6,0,0,1-6,6H40a6,6,0,0,1,0-12H216A6,6,0,0,1,222,128ZM40,70H216a6,6,0,0,0,0-12H40a6,6,0,0,0,0,12ZM216,186H40a6,6,0,0,0,0,12H216a6,6,0,0,0,0-12Z"/></svg>
<svg class="ssm-icon-close" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M204.24,195.76a6,6,0,1,1-8.48,8.48L128,136.49,60.24,204.24a6,6,0,0,1-8.48-8.48L119.51,128,51.76,60.24a6,6,0,0,1,8.48-8.48L128,119.51l67.76-67.75a6,6,0,0,1,8.48,8.48L136.49,128Z"/></svg>
</button>
<nav class="ssm-panel" aria-label="Menú principal">
<div class="ssm-inner">
<!-- Se rellena solo con la cabecera de escritorio: los enlaces del menú de WordPress (Apariencia → Menús),
     después los botones de la cabecera; el primero es el botón destacado del final. -->
<ul class="ssm-list"></ul>
<div class="ssm-cta"></div>
</div>
</nav>
</div>
<style>
/* Menú móvil Soulsical (cabecera del Theme Builder, layout 41). Solo tokens del sistema: --gcid-* colores, --gvid-* variables. */
.ssm-toggle{display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin:0 -8px 0 0;padding:0;border:0;background:none;color:var(--gcid-heading-color);cursor:pointer}
.ssm-toggle svg{width:var(--gvid-gupqrxqjha);height:var(--gvid-gupqrxqjha)}
.ssm-toggle .ssm-icon-close,.ssm-toggle[aria-expanded="true"] .ssm-icon-open{display:none}
.ssm-toggle[aria-expanded="true"] .ssm-icon-close{display:block}
.ssm-toggle:focus-visible{outline:2px solid var(--gcid-primary-color);outline-offset:2px;border-radius:var(--gvid-4sil5vvzez)}
.ssm-panel{position:fixed;left:0;right:0;top:0;z-index:98;display:grid;grid-template-rows:0fr;visibility:hidden;background:var(--gcid-z44qg3qevy);transition:grid-template-rows .3s ease,visibility 0s linear .3s}
.ssm-panel.is-open{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .3s ease,visibility 0s;box-shadow:0 24px 32px -24px color-mix(in srgb,var(--gcid-vdcqqbuvlk) 25%,transparent)}
.ssm-inner{overflow:hidden;min-height:0}
.ssm-panel ul{list-style:none;margin:0;padding:0;border-top:1px solid color-mix(in srgb,var(--gcid-primary-color) 10%,transparent)}
.ssm-panel li{margin:0;padding:0;border-bottom:1px solid color-mix(in srgb,var(--gcid-primary-color) 10%,transparent)}
.ssm-list a{display:block;padding:var(--gvid-sjlrypwvt0) var(--ssm-inset,5vw);font-family:var(--et_global_heading_font);font-size:var(--gvid-vfe3ztufny);line-height:1.2;letter-spacing:.02em;text-transform:uppercase;color:var(--gcid-heading-color);text-decoration:none;transition:color .2s ease}
.ssm-list a:hover,.ssm-list a:focus-visible,.ssm-list a[aria-current="page"]{color:var(--gcid-primary-color)}
.ssm-list .ssm-sub a{padding-left:calc(var(--ssm-inset,5vw) + var(--gvid-sjlrypwvt0));font-family:var(--et_global_body_font);font-size:var(--gvid-m4ylyrnh8s);text-transform:none;letter-spacing:0}
.ssm-cta{padding:var(--gvid-sjlrypwvt0) var(--ssm-inset,5vw) var(--gvid-389tl2n52q)}
.ssm-cta:empty{display:none}
.ssm-cta a{display:block;padding:var(--gvid-qjjmjiecpn) var(--gvid-sjlrypwvt0);border-radius:var(--gvid-4sil5vvzez);background:var(--gcid-primary-color);color:var(--gcid-edgtn3vz2h);font-family:var(--et_global_body_font);font-size:var(--gvid-njekvx6iav);font-weight:600;letter-spacing:.05em;text-align:center;text-transform:uppercase;text-decoration:none;transition:background-color .2s ease}
.ssm-cta a:hover,.ssm-cta a:focus-visible{background:var(--gcid-qrxt0zxlob)}
@media (prefers-reduced-motion:reduce){.ssm-panel,.ssm-panel.is-open{transition:none}}
</style>
<script>
(function () {
	if (window.ssmReady) return;
	window.ssmReady = true;
	var open = null; // the .ssm currently open

	function place(menu) {
		var panel = menu.querySelector('.ssm-panel');
		var bar = menu.closest('.et_pb_section') || menu;
		var row = menu.closest('.et_pb_row') || bar;
		var top = Math.max(0, bar.getBoundingClientRect().bottom);
		panel.style.top = top + 'px';
		// If an ancestor turns "fixed" into "relative to it" (transforms), correct the offset.
		var drift = panel.getBoundingClientRect().top - top;
		if (Math.abs(drift) > 1) panel.style.top = (top - drift) + 'px';
		panel.style.setProperty('--ssm-inset', Math.max(0, row.getBoundingClientRect().left) + 'px');
	}

	function set(menu, state) {
		var toggle = menu.querySelector('.ssm-toggle');
		if (state) place(menu);
		menu.querySelector('.ssm-panel').classList.toggle('is-open', state);
		toggle.setAttribute('aria-expanded', state ? 'true' : 'false');
		toggle.setAttribute('aria-label', state ? 'Cerrar menú' : 'Abrir menú');
		open = state ? menu : null;
	}

	document.addEventListener('click', function (e) {
		var toggle = e.target.closest('.ssm-toggle');
		if (toggle) {
			var menu = toggle.closest('.ssm');
			if (open && open !== menu) set(open, false);
			set(menu, open !== menu);
			return;
		}
		if (open && (e.target.closest('.ssm-panel a') || !e.target.closest('.ssm-panel'))) set(open, false);
	});
	document.addEventListener('keydown', function (e) {
		if (e.key === 'Escape' && open) {
			var toggle = open.querySelector('.ssm-toggle');
			set(open, false);
			toggle.focus();
		}
	});
	window.addEventListener('scroll', function () { if (open) place(open); }, { passive: true });
	window.addEventListener('resize', function () { if (open) { if (window.innerWidth > 980) set(open, false); else place(open); } });

	// One source: the desktop header (WordPress menu + header buttons) fills every mobile panel.
	function build() {
		var header = document.querySelector('.et-l--header') || document;
		var source = header.querySelector('ul.et-menu');
		var buttons = [].filter.call(header.querySelectorAll('a.et_pb_button'), function (b) { return !b.closest('.ssm'); });
		var here = location.pathname.replace(/\/+$/, '') + '/';
		function link(a, sub) {
			var li = document.createElement('li');
			var copy = document.createElement('a');
			copy.href = a.getAttribute('href') || '#';
			copy.textContent = a.textContent.trim();
			if (a.target) copy.target = a.target;
			if (a.rel) copy.rel = a.rel;
			var item = a.closest('li');
			var current = (item && /\bcurrent-menu-item\b/.test(item.className)) || (copy.getAttribute('href') !== '#' && new URL(copy.href, location.href).pathname.replace(/\/+$/, '') + '/' === here);
			if (current) copy.setAttribute('aria-current', 'page');
			if (sub) li.className = 'ssm-sub';
			li.appendChild(copy);
			return li;
		}
		document.querySelectorAll('.ssm').forEach(function (menu) {
			var list = menu.querySelector('.ssm-list');
			var cta = menu.querySelector('.ssm-cta');
			if (!list || list.children.length) return;
			if (source) {
				[].forEach.call(source.children, function (li) {
					var a = li.querySelector(':scope > a');
					if (!a) return;
					list.appendChild(link(a, false));
					[].forEach.call(li.querySelectorAll(':scope > ul > li > a'), function (child) { list.appendChild(link(child, true)); });
				});
			}
			buttons.slice(1).forEach(function (b) { list.appendChild(link(b, false)); });
			if (buttons[0]) {
				var main = document.createElement('a');
				main.href = buttons[0].getAttribute('href') || '#';
				main.textContent = buttons[0].textContent.trim();
				if (buttons[0].target) main.target = buttons[0].target;
				cta.appendChild(main);
			}
		});
	}
	if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', build); else build();
})();
</script>
